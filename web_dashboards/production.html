<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asthana Bakery - Production & Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FEF2F2; /* red-50 */ }
        .tab-button { transition: all 0.3s; border-bottom: 4px solid transparent; padding: 1rem; font-weight: 600; color: #4B5563; }
        .tab-button.active { border-color: #6A0B0B; color: #6A0B0B; background-color: #FEE2E2; /* red-100 */ }
        .modal-bg { background-color: rgba(0,0,0,0.5); }
        input, select, textarea {
            border: 1px solid #D1D5DB; /* gray-300 */
            border-radius: 0.5rem; /* rounded-lg */
            padding: 0.75rem;
            width: 100%;
            transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #6A0B0B; 
            box-shadow: 0 0 0 2px #FCA5A5; /* red-300 */
        }
        .search-input-container { position: relative; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-2xl p-6 md:p-8">
        
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-[#6A0B0B]">Production & Inventory</h1>
            <p class="text-gray-500 mt-2">Manage ingredients, recipes, and record production batches.</p>
        </div>

        <div class="border-b border-gray-200 mb-6">
            <nav class="-mb-px flex flex-wrap" aria-label="Tabs">
                <button onclick="changeTab('production')" class="tab-button active" id="tab-production"><i class="fas fa-cookie-bite mr-2"></i>Production</button>
                <button onclick="changeTab('recipes')" class="tab-button" id="tab-recipes"><i class="fas fa-book-open mr-2"></i>Products & Recipes</button>
                <button onclick="changeTab('inventory')" class="tab-button" id="tab-inventory"><i class="fas fa-warehouse mr-2"></i>Ingredient Inventory</button>
            </nav>
        </div>

        <main>
            <div id="content-production" class="tab-content">
                <div class="grid md:grid-cols-2 gap-8">
                    <div class="bg-gray-50 p-6 rounded-lg border border-gray-200">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4">Record New Batch</h2>
                        <div class="space-y-4">
                            <div>
                                <label for="productionUnitSelect" class="block text-sm font-medium text-gray-700">Production Unit</label>
                                <select id="productionUnitSelect" class="mt-1"></select>
                            </div>
                            <hr>
                            <div class="search-input-container">
                                <input type="text" id="production-search" placeholder="Search product to make..." class="pl-10">
                                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            </div>
                            <div>
                                <label for="prodRecipeSelect" class="block text-sm font-medium text-gray-700">Product to Make</label>
                                <select id="prodRecipeSelect" class="mt-1"></select>
                            </div>
                            <div>
                                <label for="prodQuantity" id="prodQuantityLabel" class="block text-sm font-medium text-gray-700">Quantity Produced</label>
                                <input type="number" id="prodQuantity" class="mt-1" placeholder="e.g., 50" min="0">
                            </div>
                            <!-- UPDATED: Button now calls the confirmation modal -->
                            <button onclick="showProductionConfirmationModal()" class="w-full bg-[#6A0B0B] text-white font-bold py-3 px-4 rounded-lg hover:bg-[#500808] text-lg flex items-center justify-center transition">
                                <i class="fas fa-plus-circle mr-2"></i>Record Production
                            </button>
                            <div id="print-label-container" class="hidden"></div>
                        </div>
                    </div>
                    <div id="ingredient-preview" class="bg-red-50 p-6 rounded-lg border-l-4 border-[#6A0B0B]"></div>
                </div>
            </div>

            <div id="content-recipes" class="tab-content hidden">
                 <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                    <h2 class="text-2xl font-bold text-gray-800">Products & Recipes</h2>
                    <div class="search-input-container w-full md:w-1/3">
                        <input type="text" id="recipes-search" placeholder="Search recipes..." class="pl-10">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    </div>
                    <button onclick="showRecipeModal()" class="bg-rose-700 text-white font-bold py-2 px-4 rounded-lg hover:bg-rose-800 w-full md:w-auto"><i class="fas fa-plus mr-2"></i>Add New Product</button>
                </div>
                <div id="recipes-list" class="space-y-2"></div>
            </div>

            <div id="content-inventory" class="tab-content hidden">
                 <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                    <h2 class="text-2xl font-bold text-gray-800">Ingredient Inventory</h2>
                    <select id="inventoryUnitSelect" class="w-full md:w-1/3"></select>
                    <button onclick="showIngredientModal()" class="bg-rose-700 text-white font-bold py-2 px-4 rounded-lg hover:bg-rose-800 w-full md:w-auto"><i class="fas fa-plus mr-2"></i>Add Ingredient to this Unit</button>
                </div>
                <div class="search-input-container w-full mb-4">
                    <input type="text" id="inventory-search" placeholder="Search ingredients in this unit..." class="pl-10">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
                <div id="ingredients-list" class="space-y-2"></div>
            </div>
        </main>
    </div>

    <div id="ingredient-modal" class="modal-bg hidden fixed inset-0 z-50 flex items-center justify-center p-4"></div>
    <div id="recipe-modal" class="modal-bg hidden fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto"></div>
    <!-- NEW: Confirmation Modal -->
    <div id="confirmation-modal" class="modal-bg hidden fixed inset-0 z-50 flex items-center justify-center p-4"></div>
    <div id="notification" class="hidden fixed top-5 right-5 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg"></div>
    <div id="error-notification" class="hidden fixed top-5 right-5 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg"></div>


    <script>
        const API_BASE_URL = 'https://Manager3-env.eba-kziervsd.ap-south-1.elasticbeanstalk.com';
        const OUTLETS_URL = `${API_BASE_URL}/outlets/manage/`;
        const RECIPES_URL = `${API_BASE_URL}/production/recipes/`;
        const RECORD_URL = `${API_BASE_URL}/production/record/`;    
        const INGREDIENTS_URL_BASE = `${API_BASE_URL}/production/inventory/`;
        const ALL_INGREDIENTS_URL = `${API_BASE_URL}/production/ingredients/all/`;

        // State variables
        let allIngredients = [];
        let allRecipes = [];
        let allOutlets = [];
        let inventories = {}; 
        
        function showNotification(message, isError = false) {
            const el = isError ? document.getElementById('error-notification') : document.getElementById('notification');
            el.textContent = message;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }
        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function changeTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            if (tabName === 'production') loadProductionTab();
            if (tabName === 'recipes') loadRecipesTab();
            if (tabName === 'inventory') loadInventoryTab();
        }

        async function loadInventoryTab() {
            try {
                const response = await fetch(OUTLETS_URL);
                allOutlets = await response.json();
                renderInventoryUnitsDropdown();
                const selectedUnitId = document.getElementById('inventoryUnitSelect').value;
                if (selectedUnitId) await fetchAndRenderIngredients(selectedUnitId);
            } catch (e) { console.error("Failed to load outlets for inventory:", e); }
        }
         
        function renderInventoryUnitsDropdown() {
            const selectEl = document.getElementById('inventoryUnitSelect');
            const productionUnits = allOutlets.filter(o => o.type === 'production');
            if (productionUnits.length > 0) {
                selectEl.innerHTML = productionUnits.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
                selectEl.onchange = () => fetchAndRenderIngredients(selectEl.value);
            } else {
                selectEl.innerHTML = '<option value="">No Production Units Found</option>';
            }
        }
         
        async function fetchAndRenderIngredients(unitId) {
            if (!unitId) {
                inventories[unitId] = [];
                renderIngredients();
                return;
            };
            try {
                const response = await fetch(`${INGREDIENTS_URL_BASE}${unitId}/`);
                inventories[unitId] = await response.json();
                renderIngredients();
            } catch (e) { console.error(`Failed to load ingredients for ${unitId}:`, e); }
        }

        function renderIngredients() {
            const listEl = document.getElementById('ingredients-list');
            const selectedUnitId = document.getElementById('inventoryUnitSelect').value;
            const currentInventory = inventories[selectedUnitId] || [];
            const filterQuery = document.getElementById('inventory-search').value.toLowerCase();
            const filtered = currentInventory.filter(ing => ing.name.toLowerCase().includes(filterQuery));
            
            listEl.innerHTML = filtered.length ? filtered.map(ing => `
                <div class="bg-red-100 p-3 rounded-lg flex justify-between items-center">
                    <div><p class="font-bold">${ing.name}</p><p class="text-sm text-gray-600">Stock: ${ing.stock} ${ing.unit}</p></div>
                    <div><button onclick="showIngredientModal('${ing.id}')" class="text-rose-700 hover:text-rose-800 mr-2"><i class="fas fa-edit"></i></button><button onclick="deleteIngredient('${ing.id}')" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button></div>
                </div>
            `).join('') : '<p class="text-gray-500 text-center">No ingredients in this unit. Add one!</p>';
        }

        function showIngredientModal(id = null) {
            const selectedUnitId = document.getElementById('inventoryUnitSelect').value;
            if (!selectedUnitId) { showNotification("Please select a production unit first.", true); return; }
            const currentInventory = inventories[selectedUnitId] || [];
            const ingredient = id ? currentInventory.find(ing => ing.id === id) : null;
            const modalEl = document.getElementById('ingredient-modal');
            const onsubmitCall = id ? `saveIngredient('${id}')` : `saveIngredient(null)`;
            modalEl.innerHTML = `
                <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
                    <h3 class="text-2xl font-bold mb-4">${id ? 'Edit' : 'Add'} Ingredient</h3>
                    <form onsubmit="event.preventDefault(); ${onsubmitCall}" class="space-y-4">
                        <input id="ing-name" type="text" placeholder="Ingredient Name (e.g., Maida)" value="${ingredient?.name || ''}" required>
                        <select id="ing-unit" required>
                            <option value="">Select Unit...</option>
                            <option value="kg" ${ingredient?.unit === 'kg' ? 'selected' : ''}>Kilogram (kg)</option>
                            <option value="gram" ${ingredient?.unit === 'gram' ? 'selected' : ''}>Gram (gm)</option>
                            <option value="litre" ${ingredient?.unit === 'litre' ? 'selected' : ''}>Litre (L)</option>
                            <option value="ml" ${ingredient?.unit === 'ml' ? 'selected' : ''}>Millilitre (ml)</option>
                            <option value="piece" ${ingredient?.unit === 'piece' ? 'selected' : ''}>Piece(s)</option>
                        </select>
                        <input id="ing-stock" type="number" step="0.01" placeholder="Initial Stock" value="${ingredient?.stock || ''}" required>
                        <input id="ing-cost" type="number" step="0.01" placeholder="Cost per Unit (e.g., 40.50)" value="${ingredient?.cost_per_unit || ''}" required>
                        <div class="flex justify-end space-x-4"><button type="button" onclick="closeModal('ingredient-modal')" class="bg-gray-500 text-white font-bold py-2 px-4 rounded">Cancel</button><button type="submit" class="bg-rose-700 hover:bg-rose-800 text-white font-bold py-2 px-4 rounded">Save</button></div>
                    </form>
                </div>`;
            modalEl.classList.remove('hidden');
        }

        async function saveIngredient(id) {
            const selectedUnitId = document.getElementById('inventoryUnitSelect').value;
            const data = { 
                name: document.getElementById('ing-name').value, 
                unit: document.getElementById('ing-unit').value, 
                stock: parseFloat(document.getElementById('ing-stock').value),
                cost_per_unit: parseFloat(document.getElementById('ing-cost').value)
            };
            const url = id ? `${API_BASE_URL}/production/inventory/${selectedUnitId}/${id}/` : `${API_BASE_URL}/production/inventory/${selectedUnitId}/`;
            const method = id ? 'PUT' : 'POST';
            await saveData(url, method, data, 'Ingredient', () => fetchAndRenderIngredients(selectedUnitId));
            closeModal('ingredient-modal');
        }

        async function deleteIngredient(id) {
            const selectedUnitId = document.getElementById('inventoryUnitSelect').value;
            await deleteData(`${API_BASE_URL}/production/inventory/${selectedUnitId}/${id}/`, 'Ingredient', () => fetchAndRenderIngredients(selectedUnitId));
        }

        async function loadRecipesTab() {
            try {
                const [recipesRes, ingredientsRes] = await Promise.all([fetch(RECIPES_URL), fetch(ALL_INGREDIENTS_URL)]);
                allRecipes = await recipesRes.json();
                allIngredients = await ingredientsRes.json();
                renderRecipes();
            } catch (e) { console.error("Failed to load recipes/ingredients:", e); }
        }

        function renderRecipes(filterQuery = '') {
            const listEl = document.getElementById('recipes-list');
            const filtered = allRecipes.filter(r => r.name.toLowerCase().includes(filterQuery.toLowerCase()));
            listEl.innerHTML = filtered.length ? filtered.map(recipe => `
                <div class="bg-red-100 p-3 rounded-lg flex justify-between items-center">
                    <div><p class="font-bold">${recipe.name}</p><p class="text-sm text-gray-600">Unit: ${recipe.unit_type}</p></div>
                    <div><button onclick="showRecipeModal('${recipe.id}')" class="text-rose-700 hover:text-rose-800 mr-2"><i class="fas fa-edit"></i></button><button onclick="deleteData('${RECIPES_URL}${recipe.id}/', 'Recipe', loadRecipesTab)" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button></div>
                </div>
            `).join('') : '<p class="text-gray-500 text-center">No recipes found.</p>';
        }

        function showRecipeModal(id = null) {
            const recipe = id ? allRecipes.find(r => r.id === id) : null;
            const modalEl = document.getElementById('recipe-modal');
            const onsubmitCall = id ? `saveRecipe('${id}')` : `saveRecipe(null)`;
            modalEl.innerHTML = `
                <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-2xl">
                    <h3 class="text-2xl font-bold mb-6">${id ? 'Edit' : 'Add'} Product Recipe</h3>
                    <form onsubmit="event.preventDefault(); ${onsubmitCall}" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input id="recipe-name" type="text" placeholder="Product Name" value="${recipe?.name || ''}" required>
                            <select id="recipe-unit">
                                <option value="piece" ${recipe?.unit_type === 'piece' ? 'selected' : ''}>Piece</option>
                                <option value="kg" ${recipe?.unit_type === 'kg' ? 'selected' : ''}>Kg</option>
                            </select>
                        </div>
                        <h4 class="text-lg font-semibold pt-4">Ingredients</h4>
                        <div id="recipe-ingredients-container" class="space-y-2"></div>
                        <button type="button" onclick="addIngredientToRecipe()" class="text-sm text-rose-700 font-semibold hover:text-rose-800">+ Add Ingredient</button>
                        
                        <h4 class="text-lg font-semibold pt-4">Nutritional & Shelf Life</h4>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <input id="recipe-shelf-life" type="number" placeholder="Shelf Life (Days)" value="${recipe?.shelf_life_days || ''}">
                            <input id="recipe-calories" type="number" step="0.1" placeholder="Calories" value="${recipe?.calories || ''}">
                            <input id="recipe-energy" type="text" placeholder="Energy (e.g., 250 kcal)" value="${recipe?.energy || ''}">
                        </div>
                        <textarea id="recipe-nutrition-info" placeholder="Other nutritional info (e.g., Protein: 5g, Fat: 10g)" class="h-24">${recipe?.nutrition_info || ''}</textarea>

                        <div class="flex justify-end space-x-4 pt-4">
                            <button type="button" onclick="closeModal('recipe-modal')" class="bg-gray-500 text-white font-bold py-2 px-4 rounded">Cancel</button>
                            <button type="submit" class="bg-rose-700 hover:bg-rose-800 text-white font-bold py-2 px-4 rounded">Save Recipe</button>
                        </div>
                    </form>
                </div>`;
            (recipe?.ingredients || []).forEach(ing => addIngredientToRecipe(ing));
            modalEl.classList.remove('hidden');
        }
         
        function addIngredientToRecipe(ing = {id: '', quantity: ''}) {
            const container = document.getElementById('recipe-ingredients-container');
            const ingredientOptions = allIngredients.map(i => `<option value="${i.id}" ${i.id === ing.id ? 'selected' : ''}>${i.name}</option>`).join('');
            const div = document.createElement('div');
            div.className = 'flex items-center space-x-2';
            div.innerHTML = `
                <select class="recipe-ing-id w-1/2">${ingredientOptions}</select>
                <input type="number" step="0.001" class="recipe-ing-qty w-1/3" placeholder="Qty" value="${ing.quantity}" required>
                <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700"><i class="fas fa-times-circle fa-lg"></i></button>
            `;
            container.appendChild(div);
        }

        async function saveRecipe(id) {
            const ingredientsData = [];
            document.querySelectorAll('#recipe-ingredients-container > div').forEach(div => {
                ingredientsData.push({
                    id: div.querySelector('.recipe-ing-id').value,
                    quantity: parseFloat(div.querySelector('.recipe-ing-qty').value)
                });
            });
            const data = {
                name: document.getElementById('recipe-name').value,
                unit_type: document.getElementById('recipe-unit').value,
                ingredients: ingredientsData,
                shelf_life_days: parseInt(document.getElementById('recipe-shelf-life').value) || null,
                calories: parseFloat(document.getElementById('recipe-calories').value) || null,
                energy: document.getElementById('recipe-energy').value || null,
                nutrition_info: document.getElementById('recipe-nutrition-info').value || null,
            };
            const url = id ? `${RECIPES_URL}${id}/` : RECIPES_URL;
            const method = id ? 'PUT' : 'POST';
            await saveData(url, method, data, 'Recipe', loadRecipesTab);
            closeModal('recipe-modal');
        }

        async function loadProductionTab() {
            try {
                const [recipesRes, outletsRes, allIngredientsRes] = await Promise.all([
                    fetch(RECIPES_URL), 
                    fetch(OUTLETS_URL),
                    fetch(ALL_INGREDIENTS_URL)
                ]);
                allRecipes = await recipesRes.json();
                allOutlets = await outletsRes.json();
                allIngredients = await allIngredientsRes.json();
                
                renderProductionUnitsDropdown();
                renderProductionRecipes();
                
                const selectedUnitId = document.getElementById('productionUnitSelect').value;
                if (selectedUnitId) await fetchAndCacheInventory(selectedUnitId);
                
                updateIngredientPreview();
            } catch (e) { 
                console.error("Failed to load data for production tab:", e); 
                document.getElementById('ingredient-preview').innerHTML = `<p class="text-red-500">Error loading data.</p>`;
            }
        }
         
        function renderProductionUnitsDropdown() {
            const selectEl = document.getElementById('productionUnitSelect');
            const productionUnits = allOutlets.filter(o => o.type === 'production');
            if (productionUnits.length > 0) {
                selectEl.innerHTML = productionUnits.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
            } else {
                selectEl.innerHTML = '<option value="">No Production Units Found</option>';
            }
        }
         
        async function fetchAndCacheInventory(unitId) {
            if (!unitId) return;
            try {
                const response = await fetch(`${API_BASE_URL}/production/inventory/${unitId}/`);
                inventories[unitId] = await response.json();
            } catch (e) { console.error(`Failed to cache ingredients for ${unitId}:`, e); }
        }
         
        function renderProductionRecipes(filterQuery = '') {
            const selectEl = document.getElementById('prodRecipeSelect');
            const filtered = allRecipes.filter(r => r.name.toLowerCase().includes(filterQuery.toLowerCase()));
            selectEl.innerHTML = filtered.length ? filtered.map(r => `<option value="${r.id}">${r.name}</option>`).join('') : '<option value="">No products match</option>';
            updateProductionUnitLabel();
            updateIngredientPreview();
        }

        function updateProductionUnitLabel() {
            const recipeId = document.getElementById('prodRecipeSelect').value;
            const recipe = allRecipes.find(r => r.id === recipeId);
            const labelEl = document.getElementById('prodQuantityLabel');
            const inputEl = document.getElementById('prodQuantity');

            if (recipe) {
                const unit = recipe.unit_type === 'kg' ? 'Kg' : 'Pieces';
                labelEl.textContent = `Quantity Produced (${unit})`;
                inputEl.placeholder = `e.g., 50 ${unit.toLowerCase()}`;
            } else {
                labelEl.textContent = 'Quantity Produced';
                inputEl.placeholder = 'e.g., 50';
            }
        }

        function updateIngredientPreview() {
            const recipeId = document.getElementById('prodRecipeSelect').value;
            const quantity = parseFloat(document.getElementById('prodQuantity').value) || 0;
            const selectedUnitId = document.getElementById('productionUnitSelect').value;
            const currentInventory = inventories[selectedUnitId] || [];
            const recipe = allRecipes.find(r => r.id === recipeId);
            const previewEl = document.getElementById('ingredient-preview');

            if (!recipe || quantity <= 0) {
                previewEl.innerHTML = `<h3 class="text-xl font-bold text-gray-800 mb-4">Ingredients Required</h3><p class="text-gray-600">Select a product and enter a quantity.</p>`;
                return;
            }

            let requiredHtml = `<h3 class="text-xl font-bold text-gray-800 mb-4">Required for ${quantity} ${recipe.unit_type}(s)</h3><ul class="list-disc list-inside space-y-1">`;
            let canProduce = true;
            recipe.ingredients.forEach(ing => {
                const fullIngredient = currentInventory.find(i => i.id === ing.id);
                const totalNeeded = ing.quantity * quantity;
                if (fullIngredient) {
                    const stockClass = totalNeeded > fullIngredient.stock ? 'text-red-500 font-bold' : 'text-green-600';
                    if (totalNeeded > fullIngredient.stock) canProduce = false;
                    requiredHtml += `<li><span class="font-semibold">${fullIngredient.name}</span>: <span class="${stockClass}">${totalNeeded.toFixed(3)} ${fullIngredient.unit}</span> (Avail: ${fullIngredient.stock})</li>`;
                } else {
                    requiredHtml += `<li><span class="font-semibold text-red-500">${ing.id} (NOT IN THIS UNIT'S INVENTORY)</span></li>`;
                    canProduce = false;
                }
            });
            requiredHtml += `</ul>`;
            if (!canProduce) requiredHtml += `<p class="mt-4 text-red-600 font-bold">Warning: Not enough ingredients in stock!</p>`;
            previewEl.innerHTML = requiredHtml;
        }

        function showProductionConfirmationModal() {
            const recipeId = document.getElementById('prodRecipeSelect').value;
            const quantity = parseFloat(document.getElementById('prodQuantity').value);
            const recipe = allRecipes.find(r => r.id === recipeId);

            if (!recipe || isNaN(quantity) || quantity <= 0) {
                showNotification("Please select a product and enter a valid quantity.", true);
                return;
            }

            const modalEl = document.getElementById('confirmation-modal');
            modalEl.innerHTML = `
                <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
                    <h3 class="text-2xl font-bold mb-4">Confirm Production</h3>
                    <p class="text-gray-600 mb-6">Are you sure you want to record the production of <span class="font-bold">${quantity} ${recipe.unit_type}(s)</span> of <span class="font-bold">${recipe.name}</span>?</p>
                    <div class="flex justify-end space-x-4">
                        <button type="button" onclick="closeModal('confirmation-modal')" class="bg-gray-500 text-white font-bold py-2 px-4 rounded">Cancel</button>
                        <button type="button" onclick="recordProduction()" class="bg-rose-700 hover:bg-rose-800 text-white font-bold py-2 px-4 rounded">Confirm</button>
                    </div>
                </div>`;
            modalEl.classList.remove('hidden');
        }

        async function recordProduction() {
            closeModal('confirmation-modal');
            const payload = {
                production_unit_id: document.getElementById('productionUnitSelect').value,
                recipe_id: document.getElementById('prodRecipeSelect').value,
                quantity: parseFloat(document.getElementById('prodQuantity').value)
            };
            
            try {
                const response = await fetch(RECORD_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    const errorBody = await response.json();
                    throw new Error(errorBody.error || 'Unknown server error');
                }
                const result = await response.json();
                showNotification(`Production Batch recorded successfully!`);
                
                const printContainer = document.getElementById('print-label-container');
                printContainer.innerHTML = `<button onclick='generateAndPrintLabel("${payload.recipe_id}", "${result.batch_id}")' class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 text-lg flex items-center justify-center transition"><i class="fas fa-print mr-2"></i>Print Batch Label</button>`;
                printContainer.classList.remove('hidden');

                await loadProductionTab();
                document.getElementById('prodQuantity').value = ''; 
                updateIngredientPreview();

            } catch (e) {
                showNotification(`Error recording production: ${e.message}`, true);
            }
        }
        
        // *** REWRITTEN: Function to generate and print the product label with correct layout ***
        async function generateAndPrintLabel(recipeId, batchId) {
            const { jsPDF } = window.jspdf;
            const recipe = allRecipes.find(r => r.id === recipeId);
            if (!recipe) {
                showNotification("Could not find recipe to print label.", true);
                return;
            }

            const doc = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: [70, 50] // Sticker size: 70mm width, 50mm height
            });

            const pageW = doc.internal.pageSize.getWidth();
            const pageH = doc.internal.pageSize.getHeight();
            const margin = 3;
            let yPos = 7;

            doc.setFontSize(14);
            doc.setFont('helvetica', 'bold');
            doc.text('Asthana', pageW / 2, yPos, { align: 'center' });
            yPos += 5;

            doc.setFontSize(10);
            doc.text(recipe.name, pageW / 2, yPos, { align: 'center' });
            yPos += 5;

            const mfgDate = new Date();
            const expDate = new Date();
            expDate.setDate(mfgDate.getDate() + (recipe.shelf_life_days || 0));
            doc.setFontSize(7);
            doc.setFont('helvetica', 'normal');
            doc.text(`Mfg. Date: ${mfgDate.toLocaleDateString('en-GB')}`, margin, yPos);
            yPos += 3.5; // Move down for the next line
            doc.text(`Exp. Date: ${expDate.toLocaleDateString('en-GB')}`, margin, yPos); // Place it below
            yPos += 4; // Move down for the next section

            const ingredientsText = recipe.ingredients.map(ing => allIngredients.find(i => i.id === ing.id)?.name || '').join(', ');
            doc.setFontSize(6);
            doc.setFont('helvetica', 'bold');
            doc.text('Ingredients:', margin, yPos);
            doc.setFont('helvetica', 'normal');
            const splitIngredients = doc.splitTextToSize(ingredientsText, pageW - (margin * 2) - 2);
            doc.text(splitIngredients, margin, yPos + 2);
            yPos += (splitIngredients.length * 2) + 3;

            doc.setFont('helvetica', 'bold');
            doc.text('Nutrition:', margin, yPos);
            doc.setFont('helvetica', 'normal');
            let nutritionY = yPos;
            
            const nutritionItems = [];
            if (recipe.energy) nutritionItems.push(`Energy: ${recipe.energy}`);
            if (recipe.calories) nutritionItems.push(`Calories: ${recipe.calories}`);
            if (recipe.nutrition_info) {
                recipe.nutrition_info.split(',').forEach(item => {
                    if (item.trim()) nutritionItems.push(item.trim());
                });
            }
            
            nutritionItems.forEach(item => {
                nutritionY += 2.5;
                if (nutritionY < pageH - 12) {
                    doc.text(item, margin + 4, nutritionY);
                }
            });
            yPos = nutritionY + 3;

            const canvas = document.createElement('canvas');
            JsBarcode(canvas, batchId, {
                format: "CODE128",
                width: 1.2,
                height: 25,
                fontSize: 10,
                margin: 0,
                textMargin: 0,
                displayValue: true
            });
            const barcodeDataUrl = canvas.toDataURL("image/jpeg", 1.0);
            const barcodeWidth = 55; // Make barcode narrower for more margin
            const barcodeX = (pageW - barcodeWidth) / 2;
            doc.addImage(barcodeDataUrl, 'JPEG', barcodeX, pageH - 12, barcodeWidth, 10);

            doc.autoPrint();
            window.open(doc.output('bloburl'), '_blank');
        }

        async function saveData(url, method, data, type, callback) {
            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if (!response.ok) {
                    const errorBody = await response.json();
                    throw new Error(errorBody.error || 'Unknown server error');
                }
                showNotification(`${type} saved successfully!`);
                if (callback) callback();
            } catch (e) { showNotification(`Error saving ${type}: ${e.message}`, true); }
        }

        async function deleteData(url, type, callback) {
            try {
                const response = await fetch(url, { method: 'DELETE' });
                if (!response.ok) throw new Error('Failed to delete');
                showNotification(`${type} deleted successfully!`);
                if (callback) callback();
            } catch (e) { showNotification(`Error deleting ${type}`, true); }
        }
         
        document.addEventListener('DOMContentLoaded', () => {
            changeTab('production');
            document.getElementById('production-search').addEventListener('input', (e) => renderProductionRecipes(e.target.value));
            document.getElementById('prodRecipeSelect').addEventListener('change', () => { updateProductionUnitLabel(); updateIngredientPreview(); });
            document.getElementById('productionUnitSelect').addEventListener('change', () => {
                const selectedUnitId = document.getElementById('productionUnitSelect').value;
                document.getElementById('print-label-container').classList.add('hidden');
                fetchAndCacheInventory(selectedUnitId).then(() => updateIngredientPreview());
            });
            document.getElementById('prodQuantity').addEventListener('input', () => {
                updateIngredientPreview();
                document.getElementById('print-label-container').classList.add('hidden');
            });
            document.getElementById('recipes-search').addEventListener('input', (e) => renderRecipes(e.target.value));
            document.getElementById('inventory-search').addEventListener('input', () => renderIngredients());
        });
    </script>
