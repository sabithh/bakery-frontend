<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asthana Bakery - Staff Attendance</title>
    <style>
        :root {
            --primary-color: #6A0B0B;
            --light-gray: #f4f4f4;
            --gray-text: #555;
            --border-color: #ddd;
            --success-green: #28a745;
            --light-green: #e9f5ec;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-gray);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background-color: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .date-display {
            text-align: center;
            color: var(--gray-text);
            font-size: 1.1em;
            margin-bottom: 25px;
            font-weight: 500;
        }

        #search-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 1em;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
        }

        .staff-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 12px;
            transition: all 0.3s ease; /* Smooth transition for color change */
        }
        
        /* --- NEW: Styling for marked attendance --- */
        .staff-item.marked-present {
            background-color: var(--light-green);
            border-left: 5px solid var(--success-green);
        }

        .staff-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
        }

        .attendance-options { display: flex; gap: 10px; }
        .attendance-options input[type="radio"] { display: none; }
        .attendance-options label {
            padding: 8px 16px;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-weight: 500;
        }
        .attendance-options input[type="radio"]:checked + label {
            background-color: var(--primary-color);
            color: #fff;
        }

        #submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        #submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px;
        }
        
        .message-success { color: var(--success-green); }
        .message-error { color: red; }
        .message-info { color: var(--gray-text); }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .staff-item { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Staff Daily Attendance</h1>
        <p class="date-display" id="current-date"></p>
        <input type="text" id="search-input" placeholder="Search for staff...">
        <div id="staff-list-container"></div>
        <p id="message"></p>
        <button id="submit-btn" disabled>Submit Attendance</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const API_BASE_URL = 'https://jxuwtvranzrhncodhqup.supabase.co/functions/v1';
            const STAFF_LIST_ENDPOINT = `${API_BASE_URL}/staff/list/`;
            const SUBMIT_ATTENDANCE_ENDPOINT = `${API_BASE_URL}/attendance/mark/`;

            const staffListContainer = document.getElementById('staff-list-container');
            const submitBtn = document.getElementById('submit-btn');
            const messageEl = document.getElementById('message');
            const dateDisplay = document.getElementById('current-date');
            const searchInput = document.getElementById('search-input');

            const today = new Date();
            dateDisplay.textContent = today.toLocaleDateString('en-IN', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });

            async function fetchStaff() {
                // ... fetchStaff logic remains the same ...
                showMessage('Loading staff list...', 'info');
                try {
                    const response = await fetch(STAFF_LIST_ENDPOINT);
                    const contentType = response.headers.get("content-type");
                    if (!response.ok || !contentType || !contentType.includes("application/json")) {
                        throw new Error(`Server returned an invalid response. Check API URL.`);
                    }
                    const staffList = await response.json();
                    renderStaffList(staffList);
                    submitBtn.disabled = false;
                    showMessage('', 'info');
                } catch (error) {
                    console.error('Failed to fetch staff:', error);
                    showMessage(error.message, 'error');
                }
            }
            
            function renderStaffList(staffList) {
                // ... renderStaffList logic remains the same ...
                let html = '';
                staffList.forEach(staff => {
                    html += `
                        <div class="staff-item" data-staff-id="${staff.id}">
                            <div class="staff-name">${staff.name}</div>
                            <div class="attendance-options">
                                <input type="radio" id="full-${staff.id}" name="attendance-${staff.id}" value="full_day" required>
                                <label for="full-${staff.id}">Full Day</label>
                                <input type="radio" id="half-${staff.id}" name="attendance-${staff.id}" value="half_day">
                                <label for="half-${staff.id}">Half Day</label>
                                <input type="radio" id="absent-${staff.id}" name="attendance-${staff.id}" value="absent" checked>
                                <label for="absent-${staff.id}">Absent</label>
                            </div>
                        </div>`;
                });
                staffListContainer.innerHTML = html;
            }

            function filterStaff() {
                // ... filterStaff logic remains the same ...
                const searchTerm = searchInput.value.toLowerCase().trim();
                const staffItems = document.querySelectorAll('.staff-item');
                staffItems.forEach(item => {
                    const staffName = item.querySelector('.staff-name').textContent.toLowerCase();
                    item.style.display = staffName.includes(searchTerm) ? 'flex' : 'none';
                });
            }

            // --- FIXED: The complete submitAttendance function ---
            async function submitAttendance() {
                const staffItems = document.querySelectorAll('.staff-item');
                const attendanceData = [];
                
                staffItems.forEach(item => {
                    const staffId = item.dataset.staffId;
                    const selectedOption = item.querySelector(`input[name="attendance-${staffId}"]:checked`);
                    if (selectedOption) {
                        attendanceData.push({
                            staff_id: staffId,
                            status: selectedOption.value,
                        });
                    }
                });
                
                showMessage('Submitting...', 'info');
                submitBtn.disabled = true;
                
                try {
                    const response = await fetch(SUBMIT_ATTENDANCE_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            date: today.toISOString().split('T')[0],
                            attendance: attendanceData
                        }),
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Server responded with an error.');
                    }
                    
                    const result = await response.json();
                    showMessage(result.message || 'Attendance submitted successfully!', 'success');

                    // --- NEW: Add green highlight after successful submission ---
                    attendanceData.forEach(item => {
                        if (item.status === 'full_day' || item.status === 'half_day') {
                            const staffDiv = document.querySelector(`.staff-item[data-staff-id="${item.staff_id}"]`);
                            if (staffDiv) {
                                staffDiv.classList.add('marked-present');
                            }
                        }
                    });
                    
                } catch (error) {
                    console.error('Failed to submit attendance:', error);
                    showMessage(`Error: ${error.message}`, 'error');
                } finally {
                    submitBtn.disabled = false;
                }
            }
            
            function showMessage(msg, type) {
                messageEl.textContent = msg;
                messageEl.className = `message-${type || 'info'}`;
            }

            searchInput.addEventListener('input', filterStaff);
            submitBtn.addEventListener('click', submitAttendance);
            fetchStaff();
        });
    </script>

</body>
</html>
