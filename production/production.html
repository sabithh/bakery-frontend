<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asthana Bakery - Staff Attendance</title>
    <style>
        /* --- 2. The CSS Styling --- */
        :root {
            --primary-color: #6A0B0B;
            --light-gray: #f4f4f4;
            --gray-text: #555;
            --border-color: #ddd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-gray);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background-color: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .date-display {
            text-align: center;
            color: var(--gray-text);
            font-size: 1.1em;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .staff-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .staff-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
        }

        .attendance-options {
            display: flex;
            gap: 10px;
        }

        .attendance-options input[type="radio"] {
            display: none; /* Hide the default radio button */
        }

        .attendance-options label {
            padding: 8px 16px;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-weight: 500;
        }

        .attendance-options input[type="radio"]:checked + label {
            background-color: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }

        #submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        #submit-btn:hover {
            background-color: #8a0f0f;
        }
        
        #submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            height: 20px;
        }
        
        .message-success { color: green; }
        .message-error { color: red; }

        /* Responsive design for mobile */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .staff-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .staff-name { margin-bottom: 5px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Staff Daily Attendance</h1>
        <p class="date-display" id="current-date"></p>

        <div id="staff-list-container">
            </div>
        
        <p id="message"></p>

        <button id="submit-btn" disabled>Submit Attendance</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- Configuration ---
            const API_BASE_URL = 'https://jxuwtvranzrhncodhqup.supabase.co/functions/v1';
            const STAFF_LIST_ENDPOINT = `${API_BASE_URL}/staff/list/`;
            const SUBMIT_ATTENDANCE_ENDPOINT = `${API_BASE_URL}/attendance/mark/`; // IMPORTANT: This endpoint needs to be created on your backend!

            // --- Get HTML Elements ---
            const staffListContainer = document.getElementById('staff-list-container');
            const submitBtn = document.getElementById('submit-btn');
            const messageEl = document.getElementById('message');
            const dateDisplay = document.getElementById('current-date');

            // --- Display Current Date ---
            const today = new Date();
            dateDisplay.textContent = today.toLocaleDateString('en-IN', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            // --- Fetch Staff from API ---
            async function fetchStaff() {
                showMessage('Loading staff list...', 'info');
                try {
                    const response = await fetch(STAFF_LIST_ENDPOINT);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const staffList = await response.json();
                    renderStaffList(staffList);
                    submitBtn.disabled = false; // Enable button after staff is loaded
                    showMessage('', 'info'); // Clear loading message
                } catch (error) {
                    console.error('Failed to fetch staff:', error);
                    showMessage('Error: Could not load staff list.', 'error');
                }
            }
            
            // --- Render the staff list on the page ---
            function renderStaffList(staffList) {
                if (!staffList || staffList.length === 0) {
                    staffListContainer.innerHTML = '<p>No staff found.</p>';
                    return;
                }
                
                let html = '';
                staffList.forEach(staff => {
                    html += `
                        <div class="staff-item" data-staff-id="${staff.id}">
                            <div class="staff-name">${staff.name}</div>
                            <div class="attendance-options">
                                <input type="radio" id="full-${staff.id}" name="attendance-${staff.id}" value="full_day" required>
                                <label for="full-${staff.id}">Full Day</label>
                                
                                <input type="radio" id="half-${staff.id}" name="attendance-${staff.id}" value="half_day">
                                <label for="half-${staff.id}">Half Day</label>
                                
                                <input type="radio" id="absent-${staff.id}" name="attendance-${staff.id}" value="absent" checked>
                                <label for="absent-${staff.id}">Absent</label>
                            </div>
                        </div>
                    `;
                });
                staffListContainer.innerHTML = html;
            }

            // --- Submit Attendance Data ---
            async function submitAttendance() {
                const staffItems = document.querySelectorAll('.staff-item');
                const attendanceData = [];
                
                staffItems.forEach(item => {
                    const staffId = item.dataset.staffId;
                    const selectedOption = item.querySelector(`input[name="attendance-${staffId}"]:checked`);
                    
                    if (selectedOption) {
                        attendanceData.push({
                            staff_id: staffId,
                            status: selectedOption.value,
                        });
                    }
                });
                
                console.log('Submitting data:', attendanceData);
                showMessage('Submitting...', 'info');
                submitBtn.disabled = true;
                
                try {
                    const response = await fetch(SUBMIT_ATTENDANCE_ENDPOINT, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            date: today.toISOString().split('T')[0], // Send date in YYYY-MM-DD format
                            attendance: attendanceData
                        }),
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Server responded with an error.');
                    }
                    
                    const result = await response.json();
                    showMessage(result.message || 'Attendance submitted successfully!', 'success');
                    
                } catch (error) {
                    console.error('Failed to submit attendance:', error);
                    showMessage(`Error: ${error.message}`, 'error');
                } finally {
                    // Re-enable the button after 2 seconds to prevent spamming
                    setTimeout(() => {
                        submitBtn.disabled = false;
                    }, 2000);
                }
            }
            
            function showMessage(msg, type) {
                messageEl.textContent = msg;
                messageEl.className = `message-${type}`;
            }

            // --- Event Listeners ---
            submitBtn.addEventListener('click', submitAttendance);

            // --- Initial Load ---
            fetchStaff();
        });
    </script>

</body>
</html>
