<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery Billing System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdfaf6; /* Light cream background */
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #f97316; /* Deep orange */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ea580c; /* Darker orange */
        }
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1000; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
        }
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        /* Styles for the QR scanner video feed */
        #reader video {
            width: 100% !important;
            height: auto !important;
            object-fit: cover;
            border-radius: 8px;
        }
        #reader__dashboard_section { /* Hide default dashboard if not needed */
            display: none;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 20px;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body class="bg-orange-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl w-full bg-white shadow-xl rounded-xl p-8 space-y-8">
        <div class="text-center">
            <h2 class="mt-6 text-4xl font-extrabold text-orange-700 tracking-tight">
                Bakery POS
            </h2>
            <p class="mt-2 text-sm text-gray-600">
                Process sales and manage inventory for your bakery outlets.
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Product Selection Section -->
            <div class="bg-gray-50 p-6 rounded-lg shadow-inner">
                <h3 class="text-2xl font-semibold text-gray-800 mb-6">Products</h3>
                <div class="mb-4 flex space-x-2">
                    <button id="addProductBtn" class="flex-1 px-4 py-2 bg-green-500 text-white font-semibold rounded-md hover:bg-green-600 transition-colors">
                        <i class="fas fa-plus mr-2"></i>Add New Product
                    </button>
                    <button id="scanProductBtn" class="flex-1 px-4 py-2 bg-blue-500 text-white font-semibold rounded-md hover:bg-blue-600 transition-colors">
                        <i class="fas fa-qrcode mr-2"></i>Scan Product QR
                    </button>
                </div>
                <div id="products-list" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <!-- Products will be dynamically loaded here -->
                </div>
            </div>

            <!-- Cart and Billing Section -->
            <div class="bg-gray-50 p-6 rounded-lg shadow-inner flex flex-col">
                <h3 class="text-2xl font-semibold text-gray-800 mb-6">Current Order</h3>
                <div id="cart-items" class="flex-grow overflow-y-auto max-h-96 pr-2">
                    <!-- Cart items will be dynamically added here -->
                    <p id="empty-cart-message" class="text-gray-500 text-center py-4">No items in cart yet.</p>
                </div>
                <div class="border-t-2 border-orange-200 pt-4 mt-6">
                    <div class="flex justify-between items-center text-xl font-bold text-gray-800">
                        <span>Total:</span>
                        <span id="total-amount">$0.00</span>
                    </div>
                    <div class="mt-4">
                        <label for="outlet-select" class="block text-sm font-medium text-gray-700 mb-2">Select Outlet:</label>
                        <select id="outlet-select" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm rounded-md shadow-sm">
                            <option value="outlet_1">Outlet 1</option>
                            <option value="outlet_2">Outlet 2</option>
                            <option value="outlet_3">Outlet 3</option>
                        </select>
                    </div>
                    <div class="mt-4">
                        <label for="customerId" class="block text-sm font-medium text-gray-700 mb-2">Customer ID (Optional):</label>
                        <input type="text" id="customerId" placeholder="Leave empty for anonymous" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                    </div>
                    <div class="mt-4">
                        <label for="paymentStatus" class="block text-sm font-medium text-gray-700 mb-2">Payment Status:</label>
                        <select id="paymentStatus" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm rounded-md shadow-sm">
                            <option value="Paid">Paid</option>
                            <option value="Pending">Pending</option>
                            <option value="Refunded">Refunded</option>
                        </select>
                    </div>
                    <div class="mt-6 grid grid-cols-2 gap-4">
                        <button id="printReceiptBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-medium text-orange-600 bg-white border-orange-600 hover:bg-orange-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 transition duration-150 ease-in-out">
                            <i class="fas fa-print mr-2"></i>Print Receipt
                        </button>
                        <button id="checkout-button" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-medium text-white bg-orange-600 hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 transition duration-150 ease-in-out">
                            Process Sale
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Product Modal -->
        <div id="addProductModal" class="modal">
            <div class="modal-content">
                <span class="close-button" data-modal="addProductModal">&times;</span>
                <h3 class="text-2xl font-semibold text-gray-800 mb-6">Add New Product</h3>
                <div class="space-y-4">
                    <div>
                        <label for="newProductName" class="block text-sm font-medium text-gray-700">Product Name</label>
                        <input type="text" id="newProductName" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                    </div>
                    <div>
                        <label for="newProductPrice" class="block text-sm font-medium text-gray-700">Price</label>
                        <input type="number" id="newProductPrice" step="0.01" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                    </div>
                    <div>
                        <label for="newProductStock" class="block text-sm font-medium text-gray-700">Initial Stock Quantity</label>
                        <input type="number" id="newProductStock" step="1" min="0" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" value="0">
                    </div>
                    <div>
                        <label for="newProductImg" class="block text-sm font-medium text-gray-700">Image URL (or Emoji text)</label>
                        <input type="text" id="newProductImg" placeholder="e.g., https://placehold.co/100x100/FFF?text=🍞 or 🍞" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                    </div>
                    <button id="saveNewProductBtn" class="w-full py-2 px-4 bg-orange-600 text-white rounded-md hover:bg-orange-700">Save Product</button>
                </div>
            </div>
        </div>

        <!-- QR Scanner Modal -->
        <div id="qrScannerModal" class="modal">
            <div class="modal-content">
                <span class="close-button" data-modal="qrScannerModal">&times;</span>
                <h3 class="text-2xl font-semibold text-gray-800 mb-6">Scan Product QR Code</h3>
                <div id="reader" class="w-full h-64 border border-gray-300 rounded-md overflow-hidden flex justify-center items-center">
                    <!-- QR scanner video feed will appear here -->
                </div>
                <div id="qr-result" class="mt-4 text-center text-lg font-semibold text-gray-700">Scan result: None</div>
            </div>
        </div>

        <!-- Notification/Success Message -->
        <div id="notification" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg text-center text-lg z-50">
            Sale Processed Successfully!
        </div>
        <div id="error-notification" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg text-center text-lg z-50">
            Error Processing Sale!
        </div>
    </div>

    <!-- HTML5-QRCODE Library -->
    <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>

    <script>
        // API Endpoints
        const SALES_API_URL = 'http://192.168.1.3:8000/sales/record-sale/'; 
        // Need a new endpoint in Django to get/add/update products in the 'items' collection
        const PRODUCTS_API_URL = 'http://192.168.1.3:8000/items/manage-products/'; // We will create this!

        // Products will now be loaded from Firestore
        let products = []; // This will be populated from API
        let cart = {}; // { itemId: { name, price, quantity, img, stock } }

        // DOM Elements
        const productsListDiv = document.getElementById('products-list');
        const cartItemsDiv = document.getElementById('cart-items');
        const totalAmountSpan = document.getElementById('total-amount');
        const emptyCartMessage = document.getElementById('empty-cart-message');
        const checkoutButton = document.getElementById('checkout-button');
        const outletSelect = document.getElementById('outlet-select');
        const notification = document.getElementById('notification');
        const errorNotification = document.getElementById('error-notification');
        const printReceiptBtn = document.getElementById('printReceiptBtn');

        // NEW: Customer and Payment DOM Elements
        const customerIdInput = document.getElementById('customerId');
        const paymentStatusSelect = document.getElementById('paymentStatus');

        // Modals and their buttons
        const addProductBtn = document.getElementById('addProductBtn');
        const addProductModal = document.getElementById('addProductModal');
        const closeButtons = document.querySelectorAll('.close-button');
        const newProductNameInput = document.getElementById('newProductName');
        const newProductPriceInput = document.getElementById('newProductPrice');
        const newProductStockInput = document.getElementById('newProductStock'); // New input for initial stock
        const newProductImgInput = document.getElementById('newProductImg');
        const saveNewProductBtn = document.getElementById('saveNewProductBtn');

        const scanProductBtn = document.getElementById('scanProductBtn');
        const qrScannerModal = document.getElementById('qrScannerModal');
        const qrResultDiv = document.getElementById('qr-result');
        let html5QrCode = null;

        // Helper to generate unique product ID (Firestore document ID) - can be product_name or a barcode
        function generateProductId(name) {
            return name.toLowerCase().replace(/\s+/g, '_'); // Simple slug for ID for now
        }

        // --- API Calls to Django Backend for Products ---
        async function fetchProducts() {
            try {
                const response = await fetch(PRODUCTS_API_URL, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    products = await response.json();
                    console.log('Products loaded from backend:', products);
                    renderProducts();
                } else {
                    const errorData = await response.json();
                    console.error('Failed to fetch products:', errorData);
                    showNotification(errorNotification);
                    errorNotification.textContent = `Error loading products: ${errorData.error || 'Unknown'}`;
                }
            } catch (error) {
                console.error('Network error fetching products:', error);
                showNotification(errorNotification);
                errorNotification.textContent = `Network error: Could not load products. Please ensure Django server is running and 'items' app is configured correctly.`; // Improved error message
            }
        }

        async function saveNewProductToBackend(productData) {
            try {
                const response = await fetch(PRODUCTS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });
                if (response.ok) {
                    const data = await response.json();
                    console.log('Product saved to backend:', data);
                    showNotification(notification);
                    notification.textContent = `Product '${productData.name}' saved!`;
                    await fetchProducts(); // Refresh products list from backend
                    return true;
                } else {
                    const errorData = await response.json();
                    console.error('Failed to save product:', errorData);
                    showNotification(errorNotification);
                    errorNotification.textContent = `Error saving product: ${errorData.error || 'Unknown'}`;
                    return false;
                }
            } catch (error) {
                console.error('Network error saving product:', error);
                showNotification(errorNotification);
                errorNotification.textContent = `Network error: Could not save product.`;
                return false;
            }
        }

        // Render products
        function renderProducts() {
            productsListDiv.innerHTML = '';
            if (products.length === 0) {
                productsListDiv.innerHTML = '<p class="text-gray-500 text-center col-span-full py-4">No products found. Add some!</p>';
            }
            products.forEach(product => {
                const isEmoji = product.img && !product.img.startsWith('http') && !product.img.startsWith('data:');
                const imgSrc = isEmoji ? '' : product.img || 'https://placehold.co/100x100/ccc/white?text=No+Img';
                const emoji = isEmoji ? `<span class="text-5xl mb-2">${product.img}</span>` : '';

                const productCard = `
                    <div class="bg-white p-4 rounded-lg shadow-md flex flex-col items-center cursor-pointer hover:shadow-lg transition-all duration-200 transform hover:scale-105" data-id="${product.id}" data-name="${product.name}" data-price="${product.price}" data-stock="${product.stock}">
                        ${isEmoji ? emoji : `<img src="${imgSrc}" onerror="this.onerror=null;this.src='https://placehold.co/100x100/ccc/white?text=Img+Error';" alt="${product.name}" class="w-16 h-16 object-cover rounded-full mb-2 border-2 border-orange-300">`}
                        <p class="text-lg font-semibold text-gray-800">${product.name}</p>
                        <p class="text-sm text-gray-600">$${product.price.toFixed(2)}</p>
                        <p class="text-xs text-gray-500">Stock: ${product.stock !== undefined ? product.stock : 'N/A'}</p>
                        <button class="mt-3 px-4 py-2 bg-orange-500 text-white text-sm font-semibold rounded-md hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2 add-to-cart-btn">Add</button>
                    </div>
                `;
                productsListDiv.innerHTML += productCard;
            });

            document.querySelectorAll('.add-to-cart-btn').forEach(button => {
                button.addEventListener('click', (event) => {
                    const productCard = event.target.closest('[data-id]');
                    const productId = productCard.dataset.id;
                    const productName = productCard.dataset.name;
                    const productPrice = parseFloat(productCard.dataset.price);
                    const productStock = parseInt(productCard.dataset.stock); // Get stock from rendered product

                    addToCart(productId, productName, productPrice, productStock);
                });
            });
        }

        // Add item to cart
        function addToCart(productId, name, price, stock) {
            if (cart[productId]) {
                if (cart[productId].quantity < stock || stock === undefined || stock === null) { // Allow adding if stock is sufficient or not tracked
                    cart[productId].quantity++;
                } else {
                    showNotification(errorNotification);
                    errorNotification.textContent = `Cannot add more ${name}. Out of stock!`;
                    return;
                }
            } else {
                if (stock > 0 || stock === undefined || stock === null) { // Allow adding if stock is available or not tracked
                    const product = products.find(p => p.id === productId);
                    if (product) {
                        cart[productId] = { ...product, quantity: 1 };
                    } else {
                        // This case should ideally not happen if products are loaded from backend
                        showNotification(errorNotification);
                        errorNotification.textContent = `Product with ID "${productId}" not found.`;
                        return;
                    }
                } else {
                    showNotification(errorNotification);
                    errorNotification.textContent = `${name} is out of stock!`;
                    return;
                }
            }
            renderCart();
        }

        // Adjust quantity in cart
        function adjustQuantity(productId, change) {
            if (cart[productId]) {
                const currentStock = products.find(p => p.id === productId)?.stock;
                if (change > 0 && currentStock !== undefined && currentStock !== null && cart[productId].quantity >= currentStock) {
                    showNotification(errorNotification);
                    errorNotification.textContent = `Cannot add more. Out of stock!`;
                    return;
                }
                cart[productId].quantity += change;
                if (cart[productId].quantity <= 0) {
                    delete cart[productId];
                }
            }
            renderCart();
        }

        // Render cart items
        function renderCart() {
            cartItemsDiv.innerHTML = '';
            let total = 0;
            const itemIds = Object.keys(cart);

            if (itemIds.length === 0) {
                emptyCartMessage.classList.remove('hidden');
            } else {
                emptyCartMessage.classList.add('hidden');
                itemIds.forEach(productId => {
                    const item = cart[productId];
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;

                    const isEmoji = item.img && !item.img.startsWith('http') && !item.img.startsWith('data:');
                    const imgSrc = isEmoji ? '' : item.img || 'https://placehold.co/40x40/ccc/white?text=Img';
                    const emoji = isEmoji ? `<span class="text-3xl mr-3">${item.img}</span>` : '';

                    const cartItemDiv = `
                        <div class="flex justify-between items-center bg-white p-3 rounded-lg shadow-sm mb-3">
                            <div class="flex items-center">
                                ${isEmoji ? emoji : `<img src="${imgSrc}" onerror="this.onerror=null;this.src='https://placehold.co/40x40/ccc/white?text=Img';" alt="${item.name}" class="w-10 h-10 object-cover rounded-full mr-3">`}
                                <div>
                                    <p class="text-lg font-medium text-gray-800">${item.name}</p>
                                    <p class="text-sm text-gray-600">$${item.price.toFixed(2)}</p>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button data-id="${item.id}" data-change="-1" class="qty-adjust-btn p-1 rounded-full bg-red-100 text-red-600 hover:bg-red-200 transition-colors">
                                    <i class="fas fa-minus"></i>
                                </button>
                                <span class="text-lg font-semibold text-gray-800">${item.quantity}</span>
                                <button data-id="${item.id}" data-change="+1" class="qty-adjust-btn p-1 rounded-full bg-green-100 text-green-600 hover:bg-green-200 transition-colors">
                                    <i class="fas fa-plus"></i>
                                </button>
                                <span class="text-lg font-semibold text-orange-600">$${itemTotal.toFixed(2)}</span>
                                <button data-id="${item.id}" class="remove-item-btn p-1 rounded-full bg-red-100 text-red-600 hover:bg-red-200 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm6 0a1 1 0 11-2 0v6a1 1 0 112 0V8z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `;
                    cartItemsDiv.innerHTML += cartItemDiv;
                });

                document.querySelectorAll('.qty-adjust-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const productCard = event.target.closest('[data-id]');
                        const productId = productCard.dataset.id;
                        const change = parseInt(button.dataset.change);
                        adjustQuantity(productId, change);
                    });
                });

                document.querySelectorAll('.remove-item-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const productCard = event.target.closest('[data-id]');
                        const productId = productCard.dataset.id;
                        adjustQuantity(productId, -cart[productId].quantity);
                    });
                });
            }
            totalAmountSpan.textContent = `$${total.toFixed(2)}`;
            checkoutButton.disabled = itemIds.length === 0;
        }

        // Show a temporary notification message
        function showNotification(messageDiv, duration = 3000) {
            messageDiv.classList.remove('hidden');
            setTimeout(() => {
                messageDiv.classList.add('hidden');
            }, duration);
        }

        // Checkout process
        checkoutButton.addEventListener('click', async () => {
            if (Object.keys(cart).length === 0) {
                errorNotification.textContent = "Cart is empty. Please add items to process sale.";
                showNotification(errorNotification, 2000); 
                return;
            }

            const outletId = outletSelect.value;
            const itemsForApi = Object.values(cart).map(item => ({
                item_id: item.id,
                quantity: item.quantity,
                unit_price: item.price
            }));
            const totalAmount = parseFloat(totalAmountSpan.textContent.replace('$', ''));

            // NEW: Get customer_id and payment_status
            const customerId = customerIdInput.value.trim() || 'anonymous'; // Use 'anonymous' if empty
            const paymentStatus = paymentStatusSelect.value;

            const payload = {
                outlet_id: outletId,
                items: itemsForApi,
                total_amount: totalAmount,
                payment_method: "cash", // Simplified for now, can be expanded
                customer_id: customerId, // NEW: Include customer ID
                payment_status: paymentStatus // NEW: Include payment status
            };

            console.log('Sending payload:', payload);

            try {
                const response = await fetch(SALES_API_URL, { // Use SALES_API_URL
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log('Sale recorded successfully:', data);
                    notification.textContent = "Sale Processed Successfully!";
                    showNotification(notification);
                    cart = {}; // Clear cart on successful sale
                    renderCart(); // Re-render empty cart
                    await fetchProducts(); // Refresh products to update stock display
                    customerIdInput.value = ''; // Clear customer ID input after sale
                } else {
                    const errorData = await response.json();
                    console.error('Error recording sale:', response.status, errorData);
                    errorNotification.textContent = `Error: ${errorData.error || 'Unknown error'}`;
                    showNotification(errorNotification);
                }
            } catch (error) {
                console.error('Network or other error:', error);
                errorNotification.textContent = `Network Error: ${error.message || 'Check connection'}`;
                showNotification(errorNotification);
            }
        });

        // Print Receipt functionality
        printReceiptBtn.addEventListener('click', () => {
            if (Object.keys(cart).length === 0) {
                errorNotification.textContent = "Cart is empty. Cannot print an empty receipt.";
                showNotification(errorNotification);
                return;
            }

            // Create print-friendly content
            const printContent = `
                <div id="print-area" class="text-black p-4">
                    <h2 class="text-2xl font-bold text-center mb-4">Bakery Receipt</h2>
                    <p class="text-center mb-4">Date: ${new Date().toLocaleDateString()}</p>
                    <p class="mb-2">Outlet: ${outletSelect.options[outletSelect.selectedIndex].text}</p>
                    <p class="mb-2">Customer ID: ${customerIdInput.value.trim() || 'Anonymous'}</p> 
                    <p class="mb-2">Payment Status: ${paymentStatusSelect.value}</p> 
                    <hr class="border-t-2 border-gray-400 my-4">
                    <h3 class="text-xl font-semibold mb-2">Items:</h3>
                    <ul class="list-none p-0">
                        ${Object.values(cart).map(item => `
                            <li class="flex justify-between py-1">
                                <span>${item.name} (${item.quantity}x)</span>
                                <span>$${(item.price * item.quantity).toFixed(2)}</span>
                            </li>
                        `).join('')}
                    </ul>
                    <hr class="border-t-2 border-gray-400 my-4">
                    <div class="flex justify-between text-xl font-bold">
                        <span>Total:</span>
                        <span>${totalAmountSpan.textContent}</span>
                    </div>
                    <p class="text-center mt-4">Thank you for your purchase!</p>
                </div>
            `;

            // Open a new window for printing
            const printWindow = window.open('', '_blank');
            printWindow.document.open();
            printWindow.document.write(`
                <html>
                <head>
                    <title>Print Receipt</title>
                    <style>
                        body { font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
                        .text-black { color: black; }
                        .text-2xl { font-size: 1.5rem; }
                        .text-xl { font-size: 1.25rem; }
                        .font-bold { font-weight: 700; }
                        .text-center { text-align: center; }
                        .mb-4 { margin-bottom: 1rem; }
                        .mb-2 { margin-bottom: 0.5rem; }
                        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
                        .my-4 { margin-top: 1rem; margin-bottom: 1rem; }
                        .flex { display: flex; }
                        .justify-between { justify-content: space-between; }
                        .text-xl { font-size: 1.25rem; }
                        .font-semibold { font-weight: 600; }
                        .list-none { list-style: none; }
                        .p-0 { padding: 0; }
                        .mt-4 { margin-top: 1rem; }
                        .border-t-2 { border-top-width: 2px; }
                        .border-gray-400 { border-color: #9ca3af; }
                    </style>
                </head>
                <body>${printContent}</body>
                </html>
            `);
            printWindow.document.close();
            printWindow.focus();
            printWindow.print();
            printWindow.close();
        });


        // Add Product Modal Logic
        addProductBtn.addEventListener('click', () => {
            addProductModal.style.display = 'flex'; // Show modal
        });

        saveNewProductBtn.addEventListener('click', async () => { // Made async to await API call
            const name = newProductNameInput.value.trim();
            const price = parseFloat(newProductPriceInput.value);
            const stock = parseInt(newProductStockInput.value); // Get initial stock
            const img = newProductImgInput.value.trim();

            if (name && !isNaN(price) && price > 0 && !isNaN(stock) && stock >= 0) {
                const newProductId = generateProductId(name);
                const productExists = products.some(p => p.id === newProductId);
                if (productExists) {
                    errorNotification.textContent = `Product with name '${name}' (ID: ${newProductId}) already exists.`;
                    showNotification(errorNotification);
                    return;
                }

                const productData = { id: newProductId, name, price, stock, img };
                const saved = await saveNewProductToBackend(productData); // Save to backend (Firestore)

                if (saved) {
                    // Products are refreshed via fetchProducts() inside saveNewProductToBackend's success path
                    addProductModal.style.display = 'none'; // Hide modal
                    newProductNameInput.value = '';
                    newProductPriceInput.value = '';
                    newProductStockInput.value = '0'; // Reset stock input
                    newProductImgInput.value = '';
                }
            } else {
                showNotification(errorNotification);
                errorNotification.textContent = "Please enter valid product name, price, and initial stock.";
            }
        });

        // QR Scanner Modal Logic
        scanProductBtn.addEventListener('click', () => {
            qrScannerModal.style.display = 'flex'; // Show modal
            qrResultDiv.textContent = 'Scan result: None'; // Reset result

            html5QrCode = new Html5Qrcode("reader");
            const qrCodeSuccessCallback = (decodedText, decodedResult) => {
                qrResultDiv.textContent = `Scan result: ${decodedText}`;
                const foundProduct = products.find(p => p.id === decodedText);
                if (foundProduct) {
                    addToCart(foundProduct.id, foundProduct.name, foundProduct.price, foundProduct.stock); // Pass all details
                    html5QrCode.stop().then(() => {
                        qrScannerModal.style.display = 'none'; // Close modal after successful scan and add
                        showNotification(notification);
                        notification.textContent = `Added ${foundProduct.name} to cart!`;
                    }).catch((err) => {
                        console.error("Failed to stop QR scanner:", err);
                    });
                } else {
                    errorNotification.textContent = `Product with QR code '${decodedText}' not found!`;
                    showNotification(errorNotification);
                }
            };
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            // Ensure camera permissions are granted by the browser
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length) {
                    html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback, (errorMessage) => {
                        // console.log(`QR Scan error: ${errorMessage}`); // Avoid excessive logging
                    });
                } else {
                    errorNotification.textContent = "No camera found or permissions denied.";
                    showNotification(errorNotification);
                    qrScannerModal.style.display = 'none'; // Close modal if no camera
                }
            }).catch(err => {
                errorNotification.textContent = `Camera access error: ${err}`;
                showNotification(errorNotification);
                qrScannerModal.style.display = 'none'; // Close modal on error
            });
        });

        // Common close logic for all modals
        closeButtons.forEach(button => {
            button.addEventListener('click', (event) => {
                const modalId = event.target.dataset.modal;
                if (modalId) {
                    document.getElementById(modalId).style.display = 'none';
                }
                // Check if scanner is running and stop it when closing QR modal
                if (html5QrCode && html5QrCode.isScanning) { 
                    html5QrCode.stop().catch((err) => {
                        console.error("Failed to stop QR scanner on close:", err);
                    });
                }
            });
        });

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            // Fetch products from backend when the page loads
            fetchProducts(); 
            renderCart(); // Initial render to show empty cart message
        });
    </script>
</body>
</html>
