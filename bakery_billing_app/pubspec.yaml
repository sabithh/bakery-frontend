name: bakery_billing_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  # Core & UI Packages
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0 # Note: Version updated for latest Dart SDK compatibility

  # Device & OS Integration
  http: ^1.2.1
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3

  # Feature-specific Packages
  mobile_scanner: ^5.1.1 # For barcode scanning
  speech_to_text: ^6.6.2
  record: ^5.1.2
  file_picker: ^8.0.5
  just_audio: ^0.9.36

  # --- Corrected & Updated Printing Packages ---
  # For generating receipt commands and layouts (replaces esc_pos_utils)
  flutter_esc_pos_utils: ^1.0.1
  # For connecting to Bluetooth printers
  blue_thermal_printer: ^1.2.3
  # For connecting to Network/WiFi printers
  flutter_esc_pos_network: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
